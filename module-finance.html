<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>core-finance Module</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #f0f9ff;
  padding: 16px;
  line-height: 1.5;
}
.module-badge {
  display: inline-block;
  background: #0066cc;
  color: white;
  font-size: 0.75rem;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 4px;
  margin-bottom: 12px;
}
.current-figure {
  font-size: 0.875rem;
  color: #333;
  margin-bottom: 16px;
}
.current-figure strong {
  font-size: 1.25rem;
  font-variant-numeric: tabular-nums;
}
.controls { display: flex; gap: 8px; flex-wrap: wrap; }
button {
  background: #0066cc;
  color: white;
  border: none;
  padding: 8px 14px;
  border-radius: 6px;
  font-size: 0.75rem;
  cursor: pointer;
  transition: background 0.15s;
}
button:hover { background: #0052a3; }
.log {
  margin-top: 16px;
  font-size: 0.75rem;
  color: #666;
  font-family: "SF Mono", Consolas, monospace;
}
</style>
</head>
<body>
<div class="module-badge">core-finance</div>
<div class="current-figure">
  Current Cash Position: <strong id="value">$148,900</strong>
</div>
<div class="controls">
  <button onclick="sendUpdate()">Change my figure</button>
  <button onclick="clearAttention()">Clear attention</button>
</div>
<div class="log" id="log"></div>

<script>
let currentValue = 148900;

function log(msg) {
  document.getElementById('log').innerHTML += msg + '<br>';
}

function sendStatus(value, attention) {
  const payload = {
    moduleId: 'core-finance',
    asAt: new Date().toISOString(),
    figure: {
      key: 'cash_position',
      value: value,
      unit: '$',
      label: 'Cash Position'
    },
    attention: attention
  };

  window.parent.postMessage({ type: 'K1_STATUS', payload }, '*');
  log(`Sent: cash_position = $${value.toLocaleString()}`);
}

function sendUpdate() {
  currentValue += Math.floor(Math.random() * 10000) - 3000;
  if (currentValue < 100000) currentValue = 100000;
  document.getElementById('value').textContent = '$' + currentValue.toLocaleString();

  sendStatus(currentValue, [
    { id: 'fin-001', summary: 'Bank reconciliation overdue by 3 days', severity: 2, href: '#' }
  ]);
}

function clearAttention() {
  sendStatus(currentValue, []);
  log('Cleared attention items');
}

sendStatus(currentValue, [
  { id: 'fin-001', summary: 'Bank reconciliation overdue by 3 days', severity: 2, href: '#' },
  { id: 'fin-003', summary: 'New expense report awaiting review', severity: 3, href: '#' }
]);

log('Module loaded — sent initial status to shell');
</script>
</body>
</html>
